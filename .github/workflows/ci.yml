name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate all song charts
        run: node tools/validate-charts.mjs
